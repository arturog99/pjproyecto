name: pjproyecto
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^3.6.1
  image: ^4.2.0

  # Base de datos local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Gestión de estado global
  provider: ^6.1.1

  # Selección de archivos en escritorio
  file_picker: ^8.0.0

  # Rutas del sistema (para guardar las fotos localmente)
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generador de código automático para Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
