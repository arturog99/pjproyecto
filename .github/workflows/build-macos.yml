name: Build macOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos

      - name: Verify build output
        run: ls -la build/macos/Build/Products/Release/

      - name: Create zip
        working-directory: build/macos/Build/Products/Release
        run: |
          APP_BUNDLE=$(find . -maxdepth 1 -name "*.app" -print -quit)
          
          if [ -z "$APP_BUNDLE" ]; then
            echo "Error: No .app bundle found in build output!"
            exit 1
          fi
          
          APP_NAME=$(basename "$APP_BUNDLE")
          ZIP_NAME="${APP_NAME%.app}.zip"
          
          echo "Found app bundle: $APP_NAME"
          echo "Creating zip: $ZIP_NAME"
          
          zip -r "$ZIP_NAME" "$APP_NAME"
          
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"   # 👈 guardamos el nombre del ZIP, no del .app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/${{ env.ZIP_NAME }}
          retention-days: 30